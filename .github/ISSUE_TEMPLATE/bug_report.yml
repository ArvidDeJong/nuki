name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a way to read an API token, to act on a smartlock without permission, or to take over an account? Please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include the error message or the log line if there is one. Never paste an API token.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The call, the Livewire page or the webhook payload that reproduces it, trimmed to the smallest example. Include your published config with the secrets removed.
      render: php
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - API client (smartlocks, logs, authorizations)
        - Authentication (token, OAuth)
        - Webhooks
        - The Livewire UI
        - Package users and permissions
        - Something else
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "13.0"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4"
    validations:
      required: true
