title: NUKI for Laravel
description: "darvis/nuki is a Laravel package for the NUKI Web API: list, lock and unlock smartlocks, read activity logs, manage keypad codes, receive signed webhooks, with a Livewire and Flux UI and optional users with permissions per lock."
url: https://arviddejong.github.io
baseurl: /nuki

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/nuki
  repository: https://github.com/ArvidDeJong/nuki
  packagist: https://packagist.org/packages/darvis/nuki
  license_url: https://github.com/ArvidDeJong/nuki/blob/main/LICENSE
  requires: "PHP 8.2+, Laravel 11, 12 or 13, Livewire 3.5+ or 4, Flux 2"
  platforms: [Laravel, Livewire]
  keywords: [laravel, nuki, nuki web api, smartlock, smart lock, door lock, keypad code, access control, webhook, oauth, livewire, flux, php]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/nuki
  Packagist: https://packagist.org/packages/darvis/nuki
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/nuki
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

# Social preview image for every page (Open Graph and Twitter card, through jekyll-seo-tag).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png
